coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

flags:
  backend:
    paths:
      - backend/authglow/
  frontend:
    paths:
      - frontend/src/

ignore:
  - "backend/tests"
  - "frontend/e2e"
  - "frontend/src/test"
  - "**/*.test.ts"
  - "**/*.test.tsx"
