name: Test Suite

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (allow ≤3 failures)
        run: |
          set -o pipefail
          pytest -q --tb=line -n auto 2>&1 | tee pytest_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          FAILURES=$(grep -c "^FAILED " pytest_output.txt || echo 0)
          if [ "$EXIT_CODE" -ne 0 ] && [ "$FAILURES" -gt 3 ]; then
            echo "BUILD FAILED: $FAILURES test failures (max 3 allowed)"
            exit 1
          fi
          echo "$FAILURES test failure(s) — within limit (≤3)"

      - name: Run ruff lint
        run: ruff check authglow/

      - name: Run mypy
        run: mypy authglow/

  frontend-tests:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest (allow ≤3 failures)
        run: |
          set -o pipefail
          npx vitest run --config vitest.config.ts 2>&1 | tee vitest_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          FAILURES=$(grep -oP 'Tests\s+\d+\s+failed\s+\|\s+\K\d+' vitest_output.txt | tail -1 || echo 0)
          if [ "$EXIT_CODE" -ne 0 ] && [ "$FAILURES" -gt 3 ]; then
            echo "BUILD FAILED: $FAILURES test failures (max 3 allowed)"
            exit 1
          fi
          echo "$FAILURES test failure(s) — within limit (≤3)"

      - name: Run type-check (tsc)
        run: npx tsc -b --noEmit

      - name: Run lint
        run: npm run lint

  build:
    name: Build
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
