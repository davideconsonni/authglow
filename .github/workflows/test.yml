name: Test Suite

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q --tb=line -n auto

      - name: Run ruff lint
        continue-on-error: true
        run: |
          pip install ruff
          ruff check authglow/

      - name: Run mypy
        continue-on-error: true
        run: |
          pip install mypy
          mypy authglow/

      - name: Run dependency audit (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend-tests:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npx vitest run --config vitest.config.ts

      - name: Run type-check (tsc)
        continue-on-error: true
        run: npx tsc -b --noEmit

      - name: Run lint
        continue-on-error: true
        run: npm run lint

      - name: Run dependency audit (npm)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build
