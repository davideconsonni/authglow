[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true
warn_unused_configs = true
ignore_missing_imports = false
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "fsspec.*",
    "cachetools.*",
    "cryptography.*",
    "starlette.*",
    "fastapi.*",
    "pydantic.*",
    "slowapi.*",
    "structlog.*",
    "bcrypt.*",
    "jinja2.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["tests/"]

[tool.ruff.lint]
select = [
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["authglow"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
