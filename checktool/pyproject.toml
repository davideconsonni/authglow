[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authglow-checktool"
version = "0.1.0"
description = "Black-box console end-to-end verifier for a running AuthGlow instance."
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "rich",
    "questionary",
    "PyJWT[crypto]",
    "pyotp",
]

[project.scripts]
checktool = "checktool.cli:main"

[tool.setuptools.packages.find]
include = ["checktool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["checktool"]

[tool.mypy]
python_version = "3.13"
strict = false
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true

[[tool.mypy.overrides]]
module = ["httpx.*", "rich.*", "questionary.*", "jwt.*", "pyotp.*"]
ignore_missing_imports = true
