# Pre-commit hooks for AuthGlow
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
# Skip one: git commit --no-verify  (NOT recommended)
#
# Gitleaks blocks commits that introduce real secrets (API keys, private
# keys, tokens, high-entropy strings). The allowlist in
# backend/tests/.gitleaks.toml whitelists the test suite, conftest, and
# documentation so legitimate fixture values don't trip the scanner.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: gitleaks (AuthGlow custom config)
        args: ["--config", "backend/tests/.gitleaks.toml"]
        # Only scan staged files. Use `pre-commit run gitleaks --all-files`
        # for a full history scan.
        stages: [pre-commit]
