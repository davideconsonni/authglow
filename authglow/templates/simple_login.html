<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ app_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            max-width: 200px;
            height: auto;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: var(--surface);
            color: var(--text-primary);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .alert.success {
            display: block;
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container card">
        <div class="logo-container">
            <img src="{{ logo_url }}" alt="{{ company_name }}" class="logo-dark">
            <img src="{{ logo_dark_url }}" alt="{{ company_name }}" class="logo-light">
        </div>

        <h1>Sign In</h1>

        <div id="alert" class="alert"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn" id="submit-btn">Sign In</button>
        </form>

        <div style="text-align: center; margin: 20px 0; color: var(--text-secondary);">
            <span>or</span>
        </div>

        <button type="button" class="btn" style="background: var(--surface-elevated); color: var(--text-primary);" onclick="loginWithPasskey()">
            🔐 Sign in with Passkey
        </button>

        <div class="footer">
            <p>Don't have an account? Contact your administrator</p>
            <p><a href="/password-reset">Forgot password?</a></p>
        </div>
    </div>

    <!-- MFA Verification Modal -->
    <div id="mfa-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000;">
        <div class="card" style="max-width: 400px; width: 90%; padding: 30px;">
            <h2 style="text-align: center; margin-bottom: 10px;">Two-Factor Authentication</h2>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 25px;">Enter the 6-digit code from your authenticator app</p>

            <div class="form-group">
                <input type="text" id="mfa-code" maxlength="6" placeholder="000000" style="text-align: center; font-size: 20px; letter-spacing: 8px; font-family: monospace;">
            </div>

            <button class="btn" id="verify-mfa-btn" onclick="verifyMFA()">Verify</button>

            <div style="text-align: center; margin-top: 15px;">
                <a href="#" onclick="cancelMFA()" style="color: var(--text-secondary); font-size: 14px;">Cancel</a>
            </div>
        </div>
    </div>

    <script src="/static/js/theme.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const alert = document.getElementById('alert');
        const submitBtn = document.getElementById('submit-btn');

        // Check if setup is needed
        async function checkSetup() {
            try {
                const response = await fetch('/api/setup/check');
                if (response.ok) {
                    const data = await response.json();
                    if (data.needs_setup) {
                        // Redirect to setup page
                        window.location.href = '/setup';
                        return true;
                    }
                }
            } catch (error) {
                console.error('Setup check failed:', error);
            }
            return false;
        }

        function showAlert(message, type = 'error') {
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
        }

        function hideAlert() {
            alert.style.display = 'none';
        }

        let currentSessionToken = null;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                const response = await fetch('/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `username=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Login failed');
                }

                const data = await response.json();

                // Check if MFA is required
                if (data.mfa_required) {
                    currentSessionToken = data.session_token;
                    document.getElementById('mfa-modal').style.display = 'flex';
                    document.getElementById('mfa-code').focus();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                    return;
                }

                // Store token
                localStorage.setItem('access_token', data.access_token);
                if (data.refresh_token) {
                    localStorage.setItem('refresh_token', data.refresh_token);
                }

                showAlert('Login successful! Redirecting...', 'success');

                // Check if user is admin
                if (data.scope && data.scope.includes('admin')) {
                    localStorage.setItem('admin_token', data.access_token);
                    setTimeout(() => window.location.href = '/dashboard', 1000);
                } else {
                    setTimeout(() => window.location.href = '/dashboard', 1000);
                }

            } catch (error) {
                showAlert(error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });

        // Verify MFA
        async function verifyMFA() {
            const code = document.getElementById('mfa-code').value;
            const verifyBtn = document.getElementById('verify-mfa-btn');

            if (!code || code.length < 6) {
                showAlert('Please enter a valid code');
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';

            try {
                const response = await fetch('/api/mfa/verify-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + currentSessionToken
                    },
                    body: JSON.stringify({ code })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Invalid code');
                }

                const data = await response.json();

                // Store token
                localStorage.setItem('access_token', data.access_token);
                if (data.refresh_token) {
                    localStorage.setItem('refresh_token', data.refresh_token);
                }

                showAlert('Login successful! Redirecting...', 'success');

                // Check if user is admin
                if (data.scope && data.scope.includes('admin')) {
                    localStorage.setItem('admin_token', data.access_token);
                }

                setTimeout(() => window.location.href = '/dashboard', 1000);

            } catch (error) {
                showAlert(error.message);
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify';
            }
        }

        // Cancel MFA
        function cancelMFA() {
            document.getElementById('mfa-modal').style.display = 'none';
            document.getElementById('mfa-code').value = '';
            currentSessionToken = null;
        }

        // Login with Passkey
        async function loginWithPasskey() {
            const email = document.getElementById('email').value;

            if (!email) {
                showAlert('Please enter your email first');
                return;
            }

            try {
                // Begin passkey authentication
                const beginResponse = await fetch('/api/passkey/auth/begin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                if (!beginResponse.ok) {
                    const error = await beginResponse.json();
                    throw new Error(error.detail || 'Failed to start passkey authentication');
                }

                const options = await beginResponse.json();

                // Convert base64url to Uint8Array
                options.challenge = Uint8Array.from(atob(options.challenge.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
                if (options.allowCredentials) {
                    options.allowCredentials = options.allowCredentials.map(cred => ({
                        ...cred,
                        id: Uint8Array.from(atob(cred.id.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))
                    }));
                }

                // Get credential from authenticator
                const credential = await navigator.credentials.get({ publicKey: options });

                // Prepare verification data
                const verification = {
                    credential_id: btoa(String.fromCharCode(...new Uint8Array(credential.rawId))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, ''),
                    client_data_json: btoa(String.fromCharCode(...new Uint8Array(credential.response.clientDataJSON))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, ''),
                    authenticator_data: btoa(String.fromCharCode(...new Uint8Array(credential.response.authenticatorData))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, ''),
                    signature: btoa(String.fromCharCode(...new Uint8Array(credential.response.signature))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '')
                };

                // Complete authentication
                const completeResponse = await fetch('/api/passkey/auth/complete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(verification)
                });

                if (!completeResponse.ok) {
                    const error = await completeResponse.json();
                    throw new Error(error.detail || 'Passkey authentication failed');
                }

                const data = await completeResponse.json();

                // Store token
                localStorage.setItem('access_token', data.access_token);

                showAlert('Login successful! Redirecting...', 'success');

                // Check if user is admin
                if (data.user && data.user.scopes && data.user.scopes.includes('admin')) {
                    localStorage.setItem('admin_token', data.access_token);
                }

                setTimeout(() => window.location.href = '/dashboard', 1000);

            } catch (error) {
                // User-friendly error messages
                let errorMessage = 'Passkey authentication failed';

                if (error.name === 'NotAllowedError') {
                    errorMessage = 'Authentication was cancelled or timed out. Please try again.';
                } else if (error.name === 'InvalidStateError') {
                    errorMessage = 'This passkey is not registered for this account.';
                } else if (error.name === 'NotSupportedError') {
                    errorMessage = 'Passkeys are not supported in this browser.';
                } else if (error.name === 'SecurityError') {
                    errorMessage = 'Security error. Please use HTTPS or localhost.';
                } else if (error.message && !error.message.includes('https://www.w3.org')) {
                    errorMessage = error.message;
                }

                showAlert(errorMessage);
            }
        }

        // Check if already logged in
        if (localStorage.getItem('access_token')) {
            window.location.href = '/dashboard';
        } else {
            // Check if setup is needed
            checkSetup();
        }
    </script>
</body>
</html>
