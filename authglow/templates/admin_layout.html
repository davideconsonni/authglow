<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Prevent FOUC by applying the correct theme immediately
        (function() {
            try {
                var theme = localStorage.getItem('authglow-theme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} - {{ company_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css?v=1.3">
    <link rel="stylesheet" href="/static/css/admin.css?v=1.3">
</head>
<body>
    <div class="admin-layout">
        {% include 'components/admin_header.html' %}
        {% include 'components/admin_nav.html' %}

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="/static/js/theme.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
