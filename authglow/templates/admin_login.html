<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - {{ company_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 3rem;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-container img {
            max-width: 200px;
            height: auto;
        }


        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
        }

        .error-message {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 0.875rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container card">
        <div class="logo-container">
            <img src="{{ logo_url }}" alt="{{ company_name }}" class="logo-dark">
            <img src="{{ logo_dark_url }}" alt="{{ company_name }}" class="logo-light">
        </div>
        <p class="subtitle">Admin Portal Login</p>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary submit-btn" id="submitBtn">Sign In</button>
        </form>

        <div style="text-align: center; margin: 20px 0; color: var(--text-secondary);">
            or
        </div>

        <button type="button" class="btn btn-outline" onclick="signInWithPasskey()" style="width: 100%;">
            🔐 Sign in with Passkey
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>
    </div>

    <script src="/static/js/theme.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Hide error
            errorMessage.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                // Login
                const response = await fetch('/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `username=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
                });

                if (!response.ok) {
                    throw new Error('Invalid credentials');
                }

                const data = await response.json();

                // Verify user has admin scope
                const userResponse = await fetch('/api/users/me', {
                    headers: {
                        'Authorization': `Bearer ${data.access_token}`
                    }
                });

                const user = await userResponse.json();

                if (!user.scopes.includes('admin')) {
                    throw new Error('Admin access required');
                }

                // Save token
                localStorage.setItem('admin_token', data.access_token);
                localStorage.setItem('admin_user', JSON.stringify(user));

                // Redirect to admin dashboard
                window.location.href = '/admin';

            } catch (error) {
                errorMessage.textContent = error.message || 'Login failed. Please try again.';
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });

        // Passkey authentication
        async function signInWithPasskey() {
            try {
                const email = document.getElementById('email').value;
                if (!email) {
                    alert('Please enter your email address first');
                    document.getElementById('email').focus();
                    return;
                }

                const optionsResponse = await fetch('/api/passkey/auth/begin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                if (!optionsResponse.ok) {
                    const error = await optionsResponse.json();
                    throw new Error(error.detail || 'Failed to start authentication');
                }

                const options = await optionsResponse.json();
                options.challenge = base64urlToBuffer(options.challenge);
                if (options.allowCredentials) {
                    options.allowCredentials = options.allowCredentials.map(cred => ({
                        ...cred,
                        id: base64urlToBuffer(cred.id)
                    }));
                }

                const credential = await navigator.credentials.get({ publicKey: options });

                const verifyResponse = await fetch('/api/passkey/auth/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        credential_id: bufferToBase64url(credential.rawId),
                        client_data_json: bufferToBase64url(credential.response.clientDataJSON),
                        authenticator_data: bufferToBase64url(credential.response.authenticatorData),
                        signature: bufferToBase64url(credential.response.signature),
                        user_handle: credential.response.userHandle ? bufferToBase64url(credential.response.userHandle) : null
                    })
                });

                if (!verifyResponse.ok) {
                    const error = await verifyResponse.json();
                    throw new Error(error.detail || 'Authentication failed');
                }

                const result = await verifyResponse.json();

                if (!result.user.scopes.includes('admin')) {
                    throw new Error('Admin access required');
                }

                localStorage.setItem('admin_token', result.access_token);
                localStorage.setItem('admin_user', JSON.stringify(result.user));
                localStorage.setItem('access_token', result.access_token);

                window.location.href = '/admin';
            } catch (error) {
                console.error('Passkey authentication error:', error);
                alert('Passkey authentication failed: ' + error.message);
            }
        }

        function base64urlToBuffer(base64url) {
            const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function bufferToBase64url(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        }
    </script>
</body>
</html>
