<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Passkeys - {{ company_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body {
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-container img {
            max-width: 200px;
            height: auto;
        }

        h1 {
            margin: 20px 0 10px;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .card {
            margin-bottom: 20px;
        }

        .passkey-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .passkey-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .passkey-item:hover {
            background: var(--surface-elevated);
            border-color: var(--primary);
        }

        .passkey-info {
            flex: 1;
        }

        .passkey-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .passkey-details {
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .passkey-detail {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .passkey-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-icon:hover {
            background: var(--surface-elevated);
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-icon.delete:hover {
            border-color: var(--error);
            color: var(--error);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="{{ logo_dark_url }}" alt="{{ company_name }}" class="logo-light">
                <img src="{{ logo_url }}" alt="{{ company_name }}" class="logo-dark">
            </div>
            <h1>Manage Passkeys</h1>
            <p class="subtitle">Secure, passwordless authentication with biometrics or security keys</p>
        </div>

        <div class="card">
            <div id="passkeyList" class="passkey-list">
                <div class="loading">Loading passkeys...</div>
            </div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-state-icon">🔐</div>
                <h3>No Passkeys Registered</h3>
                <p>Passkeys let you sign in securely without a password using your fingerprint, face, or security key.</p>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="registerPasskey()">➕ Add New Passkey</button>
            <button class="btn btn-outline" onclick="goBack()">← Back</button>
        </div>
    </div>

    <script src="/static/js/theme.js"></script>
    <script>
        const token = localStorage.getItem('access_token') || localStorage.getItem('admin_token');
        if (!token) {
            window.location.href = '/login';
        }

        async function loadPasskeys() {
            try {
                const listContainer = document.getElementById('passkeyList');
                const emptyState = document.getElementById('emptyState');

                // Show loading state
                listContainer.style.display = 'block';
                listContainer.innerHTML = '<div class="loading">Loading passkeys...</div>';
                emptyState.style.display = 'none';

                const response = await fetch('/api/passkey/list', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    console.error('Response status:', response.status);
                    throw new Error('Failed to load passkeys');
                }

                const passkeys = await response.json();
                console.log('Loaded passkeys:', passkeys);

                if (passkeys.length === 0) {
                    listContainer.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }

                listContainer.innerHTML = passkeys.map(pk => `
                    <div class="passkey-item">
                        <div class="passkey-info">
                            <div class="passkey-name">${pk.name}</div>
                            <div class="passkey-details">
                                <span class="passkey-detail">
                                    📅 Created: ${new Date(pk.created_at).toLocaleDateString()}
                                </span>
                                ${pk.last_used_at ? `
                                    <span class="passkey-detail">
                                        ⏱️ Last used: ${new Date(pk.last_used_at).toLocaleDateString()}
                                    </span>
                                ` : ''}
                                ${pk.device_type ? `
                                    <span class="passkey-detail">
                                        🔧 ${pk.device_type}
                                    </span>
                                ` : ''}
                                ${pk.backup_eligible ? `
                                    <span class="passkey-detail" title="Can be backed up">
                                        ☁️ Synced
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                        <div class="passkey-actions">
                            <button class="btn-icon delete" onclick="deletePasskey('${pk.credential_id}')" title="Delete">
                                🗑️
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading passkeys:', error);
                alert('Failed to load passkeys: ' + error.message);
            }
        }

        async function registerPasskey() {
            try {
                // Get registration options from server
                const optionsResponse = await fetch('/api/passkey/register/begin', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!optionsResponse.ok) {
                    throw new Error('Failed to start registration');
                }

                const options = await optionsResponse.json();

                // Convert base64url strings to ArrayBuffers for WebAuthn API
                options.challenge = base64urlToBuffer(options.challenge);
                options.user.id = base64urlToBuffer(options.user.id);
                if (options.excludeCredentials) {
                    options.excludeCredentials = options.excludeCredentials.map(cred => ({
                        ...cred,
                        id: base64urlToBuffer(cred.id)
                    }));
                }

                // Call WebAuthn API
                const credential = await navigator.credentials.create({ publicKey: options });

                // Get user-friendly name
                const name = prompt('Enter a name for this passkey (e.g., "My iPhone", "YubiKey"):', 'My Passkey');
                if (!name) return;

                // Send credential to server for verification
                const verifyResponse = await fetch('/api/passkey/register/complete', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        credential_id: bufferToBase64url(credential.rawId),
                        client_data_json: bufferToBase64url(credential.response.clientDataJSON),
                        attestation_object: bufferToBase64url(credential.response.attestationObject),
                        transports: credential.response.getTransports ? credential.response.getTransports() : [],
                        name: name
                    })
                });

                if (!verifyResponse.ok) {
                    const error = await verifyResponse.json();
                    throw new Error(error.detail || 'Registration failed');
                }

                alert('Passkey registered successfully!');
                await loadPasskeys();
            } catch (error) {
                console.error('Registration error:', error);
                alert('Failed to register passkey: ' + error.message);
            }
        }

        async function deletePasskey(credentialId) {
            if (!confirm('Are you sure you want to delete this passkey?')) return;

            try {
                const response = await fetch(`/api/passkey/${credentialId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to delete passkey');

                alert('Passkey deleted successfully');
                loadPasskeys();
            } catch (error) {
                console.error('Delete error:', error);
                alert('Failed to delete passkey: ' + error.message);
            }
        }

        function goBack() {
            window.history.back();
        }

        // Base64url encoding/decoding helpers
        function base64urlToBuffer(base64url) {
            const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function bufferToBase64url(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        }

        loadPasskeys();
    </script>
</body>
</html>
