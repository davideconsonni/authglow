<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resend Verification - {{ company_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css?v=1.2">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Mirroring styles from login.html for consistency */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 400px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            max-width: 150px; /* Reduced logo size */
            height: auto;
        }

        #resend-form button {
            margin-top: 1.5rem; /* Added space above button */
        }
    </style>
</head>
<body>
    <div class="form-container card">
        <div class="logo-container">
            <img src="{{ logo_url_light if logo_url_light else '/static/images/authglow_light.png' }}" alt="{{ company_name }} Logo" class="logo-light">
            <img src="{{ logo_url_dark if logo_url_dark else '/static/images/authglow_dark.png' }}" alt="{{ company_name }} Logo" class="logo-dark">
        </div>

        <h2>Resend Verification Email</h2>
        <p class="subtitle" style="margin-bottom: 2rem;">Enter your email address to receive a new verification link.</p>
        
        <div id="error-message" class="error-message" style="display: none;"></div>
        <div id="success-message" class="success-message" style="display: none;"></div>

        <form id="resend-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary">Send Verification Email</button>
        </form>

        <div class="footer" style="text-align: center; margin-top: 2rem;">
            <a href="/login">Back to Sign In</a>
        </div>
    </div>

    <script src="/static/js/theme.js"></script>
    <script>
        document.getElementById('resend-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const button = e.target.querySelector('button');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            button.disabled = true;
            button.textContent = 'Sending...';

            try {
                const response = await fetch('/api/users/resend-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to send email.');
                }

                successDiv.textContent = 'A new verification email has been sent. Please check your inbox.';
                successDiv.style.display = 'block';
                document.getElementById('resend-form').reset();

            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                button.disabled = false;
                button.textContent = 'Send Verification Email';
            }
        });
    </script>
</body>
</html>
