<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Prevent FOUC by applying the correct theme immediately
        (function() {
            try {
                var theme = localStorage.getItem('authglow-theme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Sessions - {{ company_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .filter-bar {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-bar input, .filter-bar select {
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--background);
            color: var(--text-primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .session-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .session-user {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        .session-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        .token-type-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-refresh {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
        }

        .badge-access {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .btn-revoke {
            background: #ef4444;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-revoke:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>
    {% include 'components/admin_header.html' %}
    {% set active_page = 'sessions' %}
    {% include 'components/admin_nav.html' %}

    <div class="main-content">
        <h1>Active Sessions & Tokens</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalSessions">-</div>
                <div class="stat-label">Total Active Sessions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalRefreshTokens">-</div>
                <div class="stat-label">Active Refresh Tokens</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalUsers">-</div>
                <div class="stat-label">Users with Active Sessions</div>
            </div>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchEmail" placeholder="Search by email..." style="flex: 1; min-width: 200px;">
            <select id="filterType">
                <option value="all">All Types</option>
                <option value="refresh">Refresh Tokens</option>
                <option value="mfa">MFA Sessions</option>
            </select>
            <button class="btn btn-primary" onclick="loadSessions()">Search</button>
            <button class="btn btn-danger" onclick="revokeAllExpired()">Cleanup Expired</button>
        </div>

        <div id="sessionsList"></div>
    </div>

    <script>
        const token = localStorage.getItem('admin_token');
        if (!token) {
            window.location.href = '/admin/login';
        }

        async function loadSessions() {
            try {
                const searchEmail = document.getElementById('searchEmail').value;
                const filterType = document.getElementById('filterType').value;

                const response = await fetch(`/api/admin/sessions?email=${searchEmail}&type=${filterType}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to load sessions');

                const data = await response.json();

                // Update stats
                document.getElementById('totalSessions').textContent = data.total_sessions || 0;
                document.getElementById('totalRefreshTokens').textContent = data.total_refresh_tokens || 0;
                document.getElementById('totalUsers').textContent = data.unique_users || 0;

                // Render sessions
                const sessionsList = document.getElementById('sessionsList');

                if (!data.sessions || data.sessions.length === 0) {
                    sessionsList.innerHTML = '<div style="text-align: center; padding: 3rem; color: var(--text-secondary);">No active sessions found</div>';
                    return;
                }

                sessionsList.innerHTML = data.sessions.map(session => `
                    <div class="session-card">
                        <div class="session-header">
                            <div>
                                <div class="session-user">${session.user_email}</div>
                                <span class="token-type-badge badge-${session.type}">${session.type}</span>
                            </div>
                            <button class="btn-revoke" onclick="revokeSession('${session.id}', '${session.type}')">
                                Revoke
                            </button>
                        </div>
                        <div class="session-info">
                            <div class="info-item">
                                <div class="info-label">Client</div>
                                <div class="info-value">${session.client_id || 'N/A'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Created</div>
                                <div class="info-value">${formatDate(session.created_at)}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Expires</div>
                                <div class="info-value">${session.expires_at ? formatDate(session.expires_at) : 'Never'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">IP Address</div>
                                <div class="info-value">${session.ip_address || 'Unknown'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Last Used</div>
                                <div class="info-value">${session.last_used_at ? formatDate(session.last_used_at) : 'Never'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Scopes</div>
                                <div class="info-value">${session.scopes ? session.scopes.join(', ') : 'N/A'}</div>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading sessions:', error);
                alert('Error loading sessions: ' + error.message);
            }
        }

        async function revokeSession(sessionId, type) {
            if (!confirm(`Revoke this ${type} session?`)) return;

            try {
                const endpoint = type === 'refresh' ?
                    `/api/admin/tokens/refresh/${sessionId}/revoke` :
                    `/api/admin/sessions/${sessionId}/revoke`;

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to revoke session');

                alert('Session revoked successfully');
                loadSessions();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function revokeAllExpired() {
            if (!confirm('Clean up all expired sessions and tokens?')) return;

            try {
                const response = await fetch('/api/admin/sessions/cleanup', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to cleanup');

                const result = await response.json();
                alert(`Cleaned up ${result.deleted} expired sessions/tokens`);
                loadSessions();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return date.toLocaleString();
        }

        function logout() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            window.location.href = '/admin/login';
        }

        // Load sessions on page load
        loadSessions();
    </script>
    <script src="/static/js/theme.js"></script>
</body>
</html>
