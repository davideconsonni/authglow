<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication - {{ company_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .mfa-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            max-width: 200px;
            height: auto;
        }


        .mfa-icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        input[type="text"] {
            font-size: 1.125rem;
            text-align: center;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        input[type="checkbox"] {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: normal;
            font-size: 0.875rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
        }

        .backup-code-hint {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .backup-code-hint p {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .backup-code-hint a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .backup-code-hint a:hover {
            text-decoration: underline;
        }

        .backup-code-info {
            display: none;
            background: var(--surface-elevated);
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .backup-code-info.show {
            display: block;
        }

        @media (max-width: 480px) {
            .mfa-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="mfa-container card">
        <div class="logo-container">
            <img src="{{ logo_dark_url }}" alt="{{ company_name }}" class="logo-light">
            <img src="{{ logo_url }}" alt="{{ company_name }}" class="logo-dark">
        </div>

        <div class="mfa-icon">🔐</div>
        <h2>Two-Factor Authentication</h2>
        <p class="description">Enter the 6-digit code from your authenticator app</p>

        <form method="post" action="/oauth2/mfa-verify">
            <input type="hidden" name="session_token" value="{{ session_token }}">

            <div class="form-group">
                <label for="code">Authentication Code</label>
                <input
                    type="text"
                    id="code"
                    name="code"
                    required
                    autofocus
                    maxlength="9"
                    placeholder="000000"
                    pattern="[0-9A-Z\-]{6,9}"
                >
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="trust_device" name="trust_device" value="true">
                <label for="trust_device">Trust this device for 30 days</label>
            </div>

            <button type="submit" class="btn btn-primary submit-btn">Verify</button>
        </form>

        <div class="backup-code-hint">
            <p>Can't access your authenticator app?</p>
            <a href="#" id="showBackupInfo">Use a backup code</a>
            <div class="backup-code-info" id="backupInfo">
                <strong>Using a backup code:</strong><br>
                Enter your 8-character backup code (format: XXXX-XXXX) in the code field above.
            </div>
        </div>
    </div>

    <script src="/static/js/theme.js"></script>
    <script>
        document.getElementById('showBackupInfo').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('backupInfo').classList.toggle('show');
        });

        // Auto-format code input
        document.getElementById('code').addEventListener('input', function(e) {
            let value = e.target.value.toUpperCase().replace(/[^0-9A-Z\-]/g, '');
            e.target.value = value;
        });
    </script>
</body>
</html>
