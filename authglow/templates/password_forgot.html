<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AuthGlow</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .forgot-container {
            width: 100%;
            max-width: 400px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            max-width: 200px;
            height: auto;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .page-description {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            display: none;
            font-size: 0.875rem;
        }

        .alert-success {
            background: rgba(39, 174, 96, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .alert-error {
            background: rgba(231, 76, 60, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .btn {
            width: 100%;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        @media (max-width: 480px) {
            .forgot-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="forgot-container card">
        <div class="logo-container">
            <img src="/static/images/authglow_full_light.png" alt="AuthGlow" class="logo-light">
            <img src="/static/images/authglow_full_dark.png" alt="AuthGlow" class="logo-dark">
        </div>

        <h1 class="page-title">Forgot Password?</h1>
        <p class="page-description">Enter your email address and we'll send you a link to reset your password.</p>

        <div id="success-alert" class="alert alert-success"></div>
        <div id="error-alert" class="alert alert-error"></div>

        <form id="forgot-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus placeholder="your@email.com">
            </div>

            <button type="submit" class="btn btn-primary" id="submit-btn">
                <span id="btn-text">Send Reset Link</span>
                <span class="loading-spinner" id="loading-spinner"></span>
            </button>
        </form>

        <div class="footer">
            <a href="/login">Back to Sign In</a>
        </div>
    </div>

    <script src="/static/js/theme.js"></script>
    <script>
        const form = document.getElementById('forgot-form');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        const successAlert = document.getElementById('success-alert');
        const errorAlert = document.getElementById('error-alert');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Clear previous messages
            successAlert.style.display = 'none';
            errorAlert.style.display = 'none';

            // Validate email
            const email = emailInput.value.trim();
            if (!email) {
                showError('Please enter your email address');
                return;
            }

            // Show loading state
            setLoading(true);

            try {
                const response = await fetch('/api/password/reset/request', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('Password reset link has been sent to your email. Please check your inbox.');
                    form.reset();
                } else {
                    showError(data.detail || 'Failed to send reset link. Please try again.');
                }
            } catch (error) {
                console.error('Password reset request error:', error);
                showError('An error occurred. Please try again later.');
            } finally {
                setLoading(false);
            }
        });

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            if (isLoading) {
                btnText.style.display = 'none';
                loadingSpinner.style.display = 'inline-block';
            } else {
                btnText.style.display = 'inline';
                loadingSpinner.style.display = 'none';
            }
        }

        function showSuccess(message) {
            successAlert.textContent = message;
            successAlert.style.display = 'block';
            successAlert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showError(message) {
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
            errorAlert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
