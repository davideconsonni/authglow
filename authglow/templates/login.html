<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - {{ company_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            max-width: 200px;
            height: auto;
        }


        .form-group {
            margin-bottom: 1.25rem;
        }

        .password-hint {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            margin-top: 0.25rem;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container card">
        <div class="logo-container">
            <img src="{{ logo_dark_url }}" alt="{{ company_name }}" class="logo-light">
            <img src="{{ logo_url }}" alt="{{ company_name }}" class="logo-dark">
        </div>

        <form method="post" action="/oauth2/authorize">
            <input type="hidden" name="client_id" value="{{ client_id }}">
            <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
            <input type="hidden" name="scope" value="{{ scope }}">
            {% if state %}
            <input type="hidden" name="state" value="{{ state }}">
            {% endif %}

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <div class="password-hint">{{ password_policy }}</div>
            </div>

            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <div class="footer">
            {% if support_email %}
            Need help? <a href="mailto:{{ support_email }}">Contact support</a><br>
            {% endif %}
            {% if privacy_policy_url %}
            <a href="{{ privacy_policy_url }}" target="_blank">Privacy Policy</a>
            {% endif %}
            {% if privacy_policy_url and terms_of_service_url %} • {% endif %}
            {% if terms_of_service_url %}
            <a href="{{ terms_of_service_url }}" target="_blank">Terms of Service</a>
            {% endif %}
        </div>
    </div>
    <script src="/static/js/theme.js"></script>
</body>
</html>
