<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - {{ company_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css?v=1.2">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .toolbar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .filter-group label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .filter-group input,
        .filter-group select {
            padding: 0.5rem 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.875rem;
            min-width: 160px;
        }
        
        .date-filter-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            padding: 0.75rem;
            background: var(--surface-light);
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        
        .date-filter-toolbar .filter-btn {
            padding: 0.5rem 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }
        
        .date-filter-toolbar .filter-btn:hover {
            background: var(--surface-elevated);
            border-color: var(--primary);
        }

        .date-filter-toolbar .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .date-custom-range {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: 1rem;
        }
        
        .date-custom-range label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .content-table {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            border-collapse: collapse;
        }

        .content-table thead {
            background: var(--surface-light);
            border-bottom: 2px solid var(--border);
        }

        .content-table th {
            padding: 0.75rem 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }

        .content-table td {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            font-size: 0.875rem;
        }
        
        .content-table tbody tr:last-child td { border-bottom: none; }
        .content-table tbody tr:hover { background: var(--surface-light); }

        .severity-badge {
            padding: 0.2rem 0.6rem; border-radius: 20px;
            font-size: 0.7rem; font-weight: 600;
            text-transform: uppercase; display: inline-block;
        }

        .severity-info { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid #3b82f6; }
        .severity-warning { background: rgba(249, 115, 22, 0.2); color: #f97316; border: 1px solid #f97316; }
        .severity-error { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        .severity-critical { background: rgba(220, 38, 38, 0.2); color: #dc2626; border: 1px solid #dc2626; }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; max-width: 700px; width: 90%; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .modal-title { font-size: 1.5rem; margin: 0; }
        .modal-body pre { background: var(--background); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; max-height: 60vh; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.875rem; color: var(--text-secondary); }
    </style>
</head>
<body>
    {% include 'components/admin_header.html' %}
    {% set active_page = 'audit' %}
    {% include 'components/admin_nav.html' %}

    <div class="main-content">
        <h1 class="page-title">📜 Audit Logs</h1>

        <div class="toolbar">
            <div class="filter-group">
                <label for="search-input">Search</label>
                <input type="text" id="search-input" placeholder="Email, event, metadata..." oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <label for="event-type-filter">Event Type</label>
                <input type="text" id="event-type-filter" placeholder="e.g., login" oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <label for="severity-filter">Severity</label>
                <select id="severity-filter" onchange="applyFilters()">
                    <option value="">All</option>
                    <option value="info">Info</option>
                    <option value="warning">Warning</option>
                    <option value="error">Error</option>
                    <option value="critical">Critical</option>
                </select>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading logs...</p>
        </div>

        <div id="logs-table-container" class="users-table" style="display: none;">
            <table class="content-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Event Type</th>
                        <th>User</th>
                        <th>IP Address</th>
                        <th>Severity</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="audit-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="details-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Log Details</h2>
                <button class="btn-icon" onclick="closeModal()" style="font-size: 1.5rem;">&times;</button>
            </div>
            <div class="modal-body">
                <pre id="modal-json-content"></pre>
            </div>
        </div>
    </div>

    <script>
        let allLogs = [];
        let filterTimeout;

        function formatDate(isoString) {
            if (!isoString) return 'N/A';
            return new Date(isoString).toLocaleString();
        }

        function renderTable(logs) {
            const tbody = document.getElementById('audit-table-body');
            tbody.innerHTML = logs.map((log, index) => `
                <tr>
                    <td>${formatDate(log.timestamp)}</td>
                    <td>${log.event_type || 'N/A'}</td>
                    <td>${log.email || 'System'}</td>
                    <td>${log.ip_address || 'N/A'}</td>
                    <td><span class="severity-badge severity-${log.severity.toLowerCase()}">${log.severity}</span></td>
                    <td><button class="btn btn-outline btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;" onclick="showDetails(${index})">Details</button></td>
                </tr>
            `).join('') || '<tr><td colspan="6" style="text-align: center; padding: 2rem;">No logs found for the selected filters.</td></tr>';
        }

        function showDetails(index) {
            const log = allLogs[index];
            document.getElementById('modal-json-content').textContent = JSON.stringify(log, null, 2);
            document.getElementById('details-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('details-modal').classList.remove('show');
        }

        async function fetchLogs(params = {}) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('logs-table-container').style.display = 'none';

            const token = localStorage.getItem('admin_token');
            if (!token) {
                window.location.href = '/admin/login';
                return;
            }

            const query = new URLSearchParams(params).toString();
            try {
                const response = await fetch(`/api/admin/audit/logs?${query}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) {
                    if (response.status === 401) window.location.href = '/admin/login';
                    throw new Error(`Failed to fetch logs: ${response.status}`);
                }
                allLogs = await response.json();
                renderTable(allLogs);
            } catch (error) {
                console.error('Error fetching audit logs:', error);
                document.getElementById('audit-table-body').innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--error); padding: 2rem;">Error loading logs.</td></tr>';
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('logs-table-container').style.display = 'block';
            }
        }

        function applyFilters() {
            clearTimeout(filterTimeout);
            filterTimeout = setTimeout(() => {
                const params = {
                    search: document.getElementById('search-input').value,
                    event_type: document.getElementById('event-type-filter').value,
                    severity: document.getElementById('severity-filter').value,
                    limit: 500
                };

                Object.keys(params).forEach(key => {
                    if (!params[key]) delete params[key];
                });
                
                fetchLogs(params);
            }, 300);
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchLogs({ limit: 500 });
        });

        document.getElementById('details-modal').addEventListener('click', (event) => {
            if (event.target === document.getElementById('details-modal')) {
                closeModal();
            }
        });
    </script>
    <script src="/static/js/theme.js"></script>
</body>
</html>
