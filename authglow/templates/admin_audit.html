<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - {{ company_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .log-entry {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.5rem;
            transition: all 0.3s;
        }

        .log-entry:hover {
            background: var(--surface-elevated);
            border-color: var(--primary);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .log-event {
            font-weight: 600;
            color: var(--text-primary);
        }

        .log-time {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .log-details {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- Header -->
    {% include 'components/admin_header.html' %}

    <!-- Navigation -->
    {% set active_page = 'audit' %}
    {% include 'components/admin_nav.html' %}

    <div class="main-content">
        <h1 class="page-title">Audit Logs</h1>
        <div id="logs" class="loading">Loading...</div>
    </div>

    <script>
        async function loadLogs() {
            const token = localStorage.getItem('admin_token');
            if (!token) {
                window.location.href = '/admin/login';
                return;
            }

            // Get current user info
            const userResponse = await fetch('/api/users/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const currentUser = await userResponse.json();
            document.getElementById('userEmail').textContent = currentUser.email;

            const response = await fetch('/api/admin/audit/logs?limit=50', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const logs = await response.json();

            document.getElementById('logs').innerHTML = logs.map(log => `
                <div class="log-entry">
                    <div class="log-header">
                        <span class="log-event">${log.event_type}</span>
                        <span class="log-time">${new Date(log.timestamp).toLocaleString()}</span>
                    </div>
                    <div class="log-details">
                        User: ${log.email || 'System'} | IP: ${log.ip_address || 'N/A'} | Severity: ${log.severity}
                    </div>
                </div>
            `).join('');
        }

        function logout() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            localStorage.removeItem('access_token');
            window.location.href = '/admin/login';
        }

        loadLogs();
    </script>
    <script src="/static/js/theme.js"></script>
</body>
</html>
