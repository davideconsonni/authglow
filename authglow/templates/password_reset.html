<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AuthGlow</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            width: 100%;
            max-width: 400px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            max-width: 200px;
            height: auto;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .page-description {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .password-strength-text {
            font-size: 0.75rem;
            margin-top: 0.25rem;
            color: var(--text-tertiary);
            display: none;
        }

        .password-hint {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            margin-top: 0.25rem;
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            display: none;
            font-size: 0.875rem;
        }

        .alert-success {
            background: rgba(39, 174, 96, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .alert-error {
            background: rgba(231, 76, 60, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .btn {
            width: 100%;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        @media (max-width: 480px) {
            .reset-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container card">
        <div class="logo-container">
            <img src="/static/images/authglow_full_light.png" alt="AuthGlow" class="logo-light">
            <img src="/static/images/authglow_full_dark.png" alt="AuthGlow" class="logo-dark">
        </div>

        <h1 class="page-title">Reset Your Password</h1>
        <p class="page-description">Enter your new password below.</p>

        <div id="success-alert" class="alert alert-success"></div>
        <div id="error-alert" class="alert alert-error"></div>

        <form id="reset-form">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required autofocus placeholder="Enter new password">
                <div class="password-strength" id="password-strength">
                    <div class="password-strength-bar" id="password-strength-bar"></div>
                </div>
                <div class="password-strength-text" id="password-strength-text"></div>
                <div class="password-hint">Must be at least 8 characters</div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirm new password">
            </div>

            <button type="submit" class="btn btn-primary" id="submit-btn">
                <span id="btn-text">Reset Password</span>
                <span class="loading-spinner" id="loading-spinner"></span>
            </button>
        </form>

        <div class="footer">
            <a href="/login">Back to Sign In</a>
        </div>
    </div>

    <script src="/static/js/theme.js"></script>
    <script>
        const form = document.getElementById('reset-form');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        const successAlert = document.getElementById('success-alert');
        const errorAlert = document.getElementById('error-alert');
        const strengthBar = document.getElementById('password-strength-bar');
        const strengthText = document.getElementById('password-strength-text');
        const strengthContainer = document.getElementById('password-strength');

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Check if token exists
        if (!token) {
            showError('Invalid or missing reset token. Please request a new password reset link.');
            submitBtn.disabled = true;
        }

        // Password strength indicator
        passwordInput.addEventListener('input', (e) => {
            const password = e.target.value;
            if (password.length === 0) {
                strengthContainer.style.display = 'none';
                strengthText.style.display = 'none';
                return;
            }

            strengthContainer.style.display = 'block';
            strengthText.style.display = 'block';

            const strength = calculatePasswordStrength(password);
            updateStrengthIndicator(strength);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Clear previous messages
            successAlert.style.display = 'none';
            errorAlert.style.display = 'none';

            // Validate inputs
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!password || !confirmPassword) {
                showError('Please fill in all fields');
                return;
            }

            if (password.length < 8) {
                showError('Password must be at least 8 characters');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            // Show loading state
            setLoading(true);

            try {
                const response = await fetch('/api/password/reset/confirm', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        new_password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('Password has been reset successfully! Redirecting to sign in...');
                    form.reset();

                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showError(data.detail || 'Failed to reset password. The link may have expired. Please request a new one.');
                }
            } catch (error) {
                console.error('Password reset error:', error);
                showError('An error occurred. Please try again later.');
            } finally {
                setLoading(false);
            }
        });

        function calculatePasswordStrength(password) {
            let strength = 0;

            // Length
            if (password.length >= 8) strength += 1;
            if (password.length >= 12) strength += 1;

            // Character variety
            if (/[a-z]/.test(password)) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^a-zA-Z0-9]/.test(password)) strength += 1;

            return Math.min(strength, 4);
        }

        function updateStrengthIndicator(strength) {
            const colors = ['#E74C3C', '#F39C12', '#F1C40F', '#2ECC71', '#27AE60'];
            const labels = ['Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
            const widths = [25, 50, 75, 90, 100];

            strengthBar.style.width = widths[strength] + '%';
            strengthBar.style.backgroundColor = colors[strength];
            strengthText.textContent = labels[strength];
            strengthText.style.color = colors[strength];
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            if (isLoading) {
                btnText.style.display = 'none';
                loadingSpinner.style.display = 'inline-block';
            } else {
                btnText.style.display = 'inline';
                loadingSpinner.style.display = 'none';
            }
        }

        function showSuccess(message) {
            successAlert.textContent = message;
            successAlert.style.display = 'block';
            successAlert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showError(message) {
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
            errorAlert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
