<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - {{ company_name }}</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body {
            background: var(--background);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .verification-container {
            background: var(--surface);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px var(--shadow);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        .success-icon {
            color: #22c55e;
        }

        .error-icon {
            color: #ef4444;
        }

        h1 {
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .message {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            margin: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--surface-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .logo {
            margin-bottom: 2rem;
            max-width: 200px;
        }
    </style>
</head>
<body>
    <div class="verification-container">
        <div class="logo-container">
            <img src="/static/images/authglow_full_dark.png" alt="{{ company_name }}" class="logo logo-dark">
            <img src="/static/images/authglow_full_light.png" alt="{{ company_name }}" class="logo logo-light">
        </div>

        {% if success %}
        <div class="icon success-icon">✓</div>
        <h1>Email Verified!</h1>
        <p class="message">{{ message }}</p>
        <a href="{{ login_url }}" class="btn btn-primary">Go to Login</a>
        {% else %}
        <div class="icon error-icon">✗</div>
        <h1>Verification Failed</h1>
        <p class="message">{{ error }}</p>
        <div>
            <a href="{{ resend_url }}" class="btn btn-primary">Resend Verification Email</a>
            <a href="{{ login_url }}" class="btn btn-secondary">Back to Login</a>
        </div>
        {% endif %}
    </div>

    <script src="/static/js/theme.js"></script>
</body>
</html>
